<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,900&amp;family=JetBrains+Mono:wght@500;700;800&amp;family=Tiro+Devanagari+Hindi&amp;display=swap');
      .bg { fill: #05472A; }
      .border-ink { stroke: #082F1C; stroke-width: 6; fill: none; }
      .border-yellow { stroke: #F7E000; stroke-width: 4; fill: none; }
      .hero-text { font-family: 'Playfair Display', Georgia, serif; font-weight: 900; fill: #F7E000; font-size: 140px; letter-spacing: -4px; }
      .devanagari { font-family: 'Tiro Devanagari Hindi', serif; font-size: 42px; fill: #F5E7A1; }
      .mono-tag { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; letter-spacing: 4px; fill: #F7E000; }
      .pink-box { fill: #FF0A87; }
      .yellow-box { fill: #F7E000; }
      .cream-box { fill: #F5E7A1; }
      .ink-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; fill: #082F1C; }
      .sub-text { font-family: 'JetBrains Mono', monospace; font-size: 14px; fill: #F5E7A1; opacity: 0.9; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="520" class="bg" />

  <!-- Poster Border Outlines -->
  <rect x="20" y="20" width="1160" height="480" class="border-yellow" />
  <rect x="28" y="28" width="1144" height="464" class="border-ink" />

  <!-- Corner Poster Accents -->
  <rect x="20" y="20" width="24" height="24" class="pink-box" />
  <rect x="1156" y="20" width="24" height="24" class="pink-box" />
  <rect x="20" y="476" width="24" height="24" class="pink-box" />
  <rect x="1156" y="476" width="24" height="24" class="pink-box" />

  <!-- Top Metadata Bar -->
  <rect x="60" y="55" width="260" height="32" class="yellow-box" />
  <text x="75" y="76" class="ink-text">HH GOA 2026 · TASK 3</text>
  
  <rect x="330" y="55" width="310" height="32" class="pink-box" />
  <text x="345" y="76" class="ink-text" style="fill: #FAFAF5;">EVM BLOCKCHAIN VERIFIED</text>

  <text x="1140" y="76" text-anchor="end" class="mono-tag" style="font-size: 13px; fill: #F5E7A1;">DIGITAL FORENSICS</text>

  <!-- Hero Typography -->
  <text x="60" y="220" class="hero-text">TRACE</text>
  <text x="60" y="280" class="devanagari">चेहरा → सबूत</text>

  <!-- Tagline & Subcopy -->
  <text x="60" y="335" class="mono-tag">DISCOVER · VERIFY · PROVE</text>
  <text x="60" y="375" class="sub-text">Face Identification · Reverse Visual Search · SHA-256 Provenance · On-Chain Notarization</text>

  <!-- Pipeline Badges at Bottom -->
  <g transform="translate(60, 415)">
    <!-- Step 1 -->
    <rect x="0" y="0" width="190" height="42" class="cream-box" stroke="#082F1C" stroke-width="2" />
    <text x="15" y="26" class="ink-text">01. FACE SCAN</text>

    <!-- Arrow -->
    <text x="200" y="27" fill="#F7E000" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">→</text>

    <!-- Step 2 -->
    <rect x="225" y="0" width="190" height="42" class="cream-box" stroke="#082F1C" stroke-width="2" />
    <text x="240" y="26" class="ink-text">02. WEB SEARCH</text>

    <!-- Arrow -->
    <text x="425" y="27" fill="#F7E000" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">→</text>

    <!-- Step 3 -->
    <rect x="450" y="0" width="190" height="42" class="cream-box" stroke="#082F1C" stroke-width="2" />
    <text x="465" y="26" class="ink-text">03. FACE MATCH</text>

    <!-- Arrow -->
    <text x="650" y="27" fill="#F7E000" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">→</text>

    <!-- Step 4 -->
    <rect x="675" y="0" width="190" height="42" class="cream-box" stroke="#082F1C" stroke-width="2" />
    <text x="690" y="26" class="ink-text">04. FINGERPRINT</text>

    <!-- Arrow -->
    <text x="875" y="27" fill="#F7E000" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="bold">→</text>

    <!-- Step 5 -->
    <rect x="900" y="0" width="180" height="42" class="yellow-box" stroke="#082F1C" stroke-width="2" />
    <text x="915" y="26" class="ink-text" style="fill: #082F1C; font-weight: 900;">05. ON-CHAIN PROOF</text>
  </g>

  <!-- Right Side Decorative Elements -->
  <g transform="translate(860, 130)">
    <rect x="0" y="0" width="280" height="230" fill="#082F1C" stroke="#F7E000" stroke-width="3" />
    <rect x="15" y="15" width="250" height="30" class="pink-box" />
    <text x="25" y="35" class="ink-text" style="fill: #FAFAF5;">EVIDENCE RECEIPT</text>
    
    <text x="20" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5E7A1">MODEL: InsightFace / ArcFace</text>
    <text x="20" y="100" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5E7A1">SEARCH: Google Lens (SerpAPI)</text>
    <text x="20" y="125" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5E7A1">HASH: SHA-256 (RFC 8785)</text>
    <text x="20" y="150" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5E7A1">CHAIN: Polygon Amoy / EVM</text>
    <text x="20" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#F5E7A1">STATUS: ✓ NOTARIZED</text>
    
    <rect x="20" y="190" width="240" height="24" fill="#F7E000" />
    <text x="30" y="207" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800" fill="#082F1C">INTEGRITY CONFIRMED</text>
  </g>
</svg>
